[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "web-agent-swarm"
version = "0.1.0"
description = "Local-first orchestration for multiple ChatGPT Web agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Web Agent Swarm contributors"}]
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp>=2.0,<3"]

[project.scripts]
web-agent-swarm = "web_agent_swarm.cli:main"
web-agent-swarm-watch = "web_agent_swarm.watcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_agent_swarm"]
